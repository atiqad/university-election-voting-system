spring.datasource.url=jdbc:mysql://localhost:3306/university_voting_system
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080

# File upload (candidate profile images)
# Fixes HTTP 413 (Payload Too Large) when uploading candidate images.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB

# Bootstrap an ADMIN account on startup (set enabled=false after first successful login)
app.bootstrap.admin.enabled=true
app.bootstrap.admin.fullName=System Admin
app.bootstrap.admin.regNo=ADMIN-001
app.bootstrap.admin.email=admin@university.local
app.bootstrap.admin.password=admin123

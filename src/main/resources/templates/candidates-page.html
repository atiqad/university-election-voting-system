<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Candidates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header__inner">
        <a class="logo-section" href="/login">
            <img th:src="@{/images/university-logo.png}" class="logo-img" alt="University logo">
            <div>
                <div class="logo-title">PAF-IAST Election Voting System</div>
                <div class="logo-subtitle">Secure campus election platform</div>
            </div>
        </a>
    </div>
</header>

<main class="page">
    <div class="container">
        <section class="card">
            <div class="card__header">
                <div>
                    <h1 class="title">Candidates</h1>
                    <p class="subtitle">Profiles and biodata</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-primary btn-add-candidate" href="/candidates/new"><span class="btn-icon" aria-hidden="true">➕</span>Add Candidate</a>
                </div>
            </div>

            <div class="toast-area">
                <div th:if="${successMessage}" class="toast toast--success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="toast toast--error" th:text="${errorMessage}"></div>
            </div>

            <div class="candidate-grid">
                <div th:if="${#lists.isEmpty(candidates)}" class="empty-state-block">
                    <div class="empty-state-block__title">No candidates added yet</div>
                    <div class="empty-state-block__subtitle">Click 'Add Candidate' to create one</div>
                </div>
                <article class="candidate-card" th:each="candidate : ${candidates}" th:classappend="${candidate.active} ? ' active-candidate' : ''">
                    <div class="candidate-head">
                        <div class="candidate-avatar">
                            <img th:if="${candidate.profileImage != null}" th:src="@{${candidate.profileImage}}" alt="Candidate photo">
                            <div th:if="${candidate.profileImage == null}" class="candidate-avatar__placeholder" aria-hidden="true"></div>
                        </div>
                        <div class="candidate-title">
                            <h2 class="candidate-name" th:text="${candidate.name}"></h2>
                            <p class="candidate-subtitle">
                                <span th:text="${candidate.position}"></span>
                                <span class="dot">•</span>
                                <span th:text="${candidate.election.title}"></span>
                            </p>
                            <div class="mt-8" sec:authorize="hasRole('ADMIN')">
                                <span th:if="${candidate.active}" class="status-badge active">Active</span>
                                <span th:if="${!candidate.active}" class="status-badge hidden">Hidden</span>
                            </div>
                        </div>
                    </div>

                    <div class="candidate-meta">
                        <div class="kv">
                            <span class="k">Department</span>
                            <span class="v" th:text="${candidate.department}"></span>
                        </div>
                        <div class="kv">
                            <span class="k">Program</span>
                            <span class="v v--icon">
                                <span class="meta-icon" aria-hidden="true">🎓</span>
                                <span th:text="${candidate.programName}"></span>
                            </span>
                        </div>
                        <div class="kv">
                            <span class="k">Contact</span>
                            <span class="v v--icon">
                                <span class="meta-icon" aria-hidden="true">📞</span>
                                <span th:text="${candidate.contactNumber}"></span>
                            </span>
                        </div>
                        <div class="kv">
                            <span class="k">Email</span>
                            <span class="v v--icon">
                                <span class="meta-icon" aria-hidden="true">📧</span>
                                <span th:text="${candidate.email}"></span>
                            </span>
                        </div>
                    </div>

                    <hr class="section-divider">

                    <div class="candidate-bio">
                        <h3 class="candidate-bio__title">Bio</h3>
                        <p class="candidate-bio__text" th:text="${candidate.bio}"></p>
                    </div>

                    <div class="mt-16 candidate-actions" sec:authorize="hasRole('ADMIN')">
                        <a class="btn btn-edit" th:href="@{'/candidates/edit/' + ${candidate.id}}">Edit</a>
                        <form th:if="${candidate.active}" th:action="@{'/candidates/deactivate/' + ${candidate.id}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-deactivate" onclick="return confirm('Hide this candidate from students?');">Hide</button>
                        </form>
                        <form th:if="${!candidate.active}" th:action="@{'/candidates/activate/' + ${candidate.id}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-success">Activate</button>
                        </form>
                        <form th:action="@{'/candidates/delete/' + ${candidate.id}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger js-confirm-delete-candidate">Delete</button>
                        </form>
                    </div>
                </article>
            </div>

            <div class="mt-16">
                <a sec:authorize="hasRole('STUDENT')" href="/student-dashboard" class="btn btn-ghost back-link">Back</a>
                <a sec:authorize="hasRole('ADMIN')" href="/admin-dashboard" class="btn btn-ghost back-link">Back</a>
            </div>
        </section>
    </div>
</main>

<!-- Delete confirmation dialog -->
<div class="modal" id="deleteCandidateModal" aria-hidden="true">
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="deleteCandidateTitle">
        <div class="modal__title" id="deleteCandidateTitle">Are you sure you want to delete this candidate?</div>
        <div class="modal__actions">
            <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
            <button type="button" class="btn btn-danger" id="deleteCandidateConfirmBtn">Delete</button>
        </div>
    </div>
</div>

<script>
    (function () {
        var modal = document.getElementById('deleteCandidateModal');
        var confirmBtn = document.getElementById('deleteCandidateConfirmBtn');
        var pendingForm = null;

        function openModal(form) {
            pendingForm = form;
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            confirmBtn.focus();
        }

        function closeModal() {
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
            pendingForm = null;
        }

        document.addEventListener('click', function (e) {
            var t = e.target;
            if (t && t.classList && t.classList.contains('js-confirm-delete-candidate')) {
                e.preventDefault();
                openModal(t.closest('form'));
                return;
            }
            if (t && t.hasAttribute && t.hasAttribute('data-modal-close')) {
                e.preventDefault();
                closeModal();
                return;
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && modal.classList.contains('is-open')) {
                closeModal();
            }
        });

        confirmBtn.addEventListener('click', function () {
            if (pendingForm) {
                pendingForm.submit();
            }
        });
    })();
</script>

</body>
</html>
